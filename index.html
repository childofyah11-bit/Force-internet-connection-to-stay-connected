<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forced Starlink Keeper </title>
    
    <link rel="dns-prefetch" href="https://8.8.8">
    <link rel="dns-prefetch" href="https://1.1.1">
    <link rel="preconnect" href="https://1.1.1" crossorigin>
    
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background-color: #0d1117; color: #c9d1d9; text-align: center; padding: 20px; margin: 0; }
        .container { max-width: 650px; margin: 0 auto; background: #161b22; padding: 25px; border-radius: 6px; border: 1px solid #30363d; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        h1 { margin-top: 0; color: #f0f6fc; font-size: 24px; }
        .status { font-size: 20px; color: #238636; font-weight: bold; margin: 10px 0; }
        .latency-badge { font-size: 14px; color: #8b949e; background: #21262d; padding: 4px 10px; border-radius: 20px; display: inline-block; margin-bottom: 15px; border: 1px solid #30363d; }
        
        .panel-box { background: #0d1117; padding: 15px; border-radius: 6px; margin-bottom: 15px; border: 1px solid #30363d; text-align: left; display: flex; flex-direction: column; gap: 12px; }
        .panel-title { font-size: 14px; font-weight: bold; color: #58a6ff; margin: 0 0 5px 0; border-bottom: 1px solid #21262d; padding-bottom: 5px; }
        .audio-controls { display: flex; flex-direction: column; gap: 10px; font-size: 13px; color: #8b949e; }
        
        input[type="file"] { font-size: 12px; color: #8b949e; }
        input[type="range"] { accent-color: #58a6ff; width: 100%; cursor: pointer; }
        audio { width: 100%; margin-top: 5px; }

        .log-container { text-align: left; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 15px; height: 180px; overflow-y: auto; font-family: monospace; font-size: 13px; color: #8b949e; }
        .success { color: #3fb950; }
        .info { color: #58a6ff; }
        .fail { color: #f85149; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Starlink Connection Keeper <sup>PERSIST</sup></h1>
        <p style="margin: 5px 0 15px 0; font-size: 14px; color: #8b949e;">Persistent Background Audio & Network Optimizer</p>
        
        <div class="status" id="status-text">Warming Sockets...</div>
        <div class="latency-badge" id="latency-text">Ping Response Time: -- ms</div>

        <!-- Audio Processing Panel -->
        <div class="panel-box">
            <div class="panel-title">🔊 Browser Media Volume Optimizer</div>
            <div class="audio-controls">
                <label>Load Media File (.mp3, .wav, .ogg):</label>
                <input type="file" id="audio-file" accept="audio/*">
                
                <div style="display: flex; justify-content: space-between; margin-top: 5px;">
                    <span>Tab Boost Level:</span>
                    <span id="boost-val" style="color: #58a6ff; font-weight: bold;">100% (Standard)</span>
                </div>
                <input type="range" id="boost-slider" min="100" max="200" value="100">
                
                <audio id="media-player" controls></audio>
            </div>
        </div>

        <div class="log-container" id="log-box"></div>
    </div>
    <script>
        const logBox = document.getElementById('log-box');
        const statusText = document.getElementById('status-text');
        const latencyText = document.getElementById('latency-text');
        const audioFile = document.getElementById('audio-file');
        const mediaPlayer = document.getElementById('media-player');
        const boostSlider = document.getElementById('boost-slider');
        const boostVal = document.getElementById('boost-val');

        let audioCtx = null;
        let gainNode = null;
        let sourceNode = null;

        function appendLog(message, type) {
            requestAnimationFrame(() => {
                const time = new Date().toLocaleTimeString();
                const logEntry = document.createElement('div');
                logEntry.className = type;
                logEntry.innerHTML = `[${time}] ${message}`;
                logBox.appendChild(logEntry);
                logBox.scrollTop = logBox.scrollHeight;
            });
        }

        // Register Service Worker for true offline validation pipelines
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(() => appendLog("Offline core architecture verified.", "success"))
                    .catch(err => appendLog(`Sync warning: ${err.message}`, "info"));
            });
        }

        // Audio Input Event Listeners
        audioFile.addEventListener('change', function() {
            const file = this.files[0];
            if (!file) return;

            mediaPlayer.src = URL.createObjectURL(file);
            appendLog(`Loaded audio asset: ${file.name}`, "info");

            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                gainNode = audioCtx.createGain();
                sourceNode = audioCtx.createMediaElementSource(mediaPlayer);
                sourceNode.connect(gainNode);
                gainNode.connect(audioCtx.destination);
            }
        });

        boostSlider.addEventListener('input', function() {
            const multiplier = this.value / 100;
            boostVal.innerText = `${this.value}%`;
            if (gainNode) gainNode.gain.setValueAtTime(multiplier, audioCtx.currentTime);
        });

        // LOAD PERSISTENT EXTERNAL BACKGROUND WORKER FILE
        // This targets the physical worker.js file to keep intervals awake
        const worker = new Worker('./worker.js');

        worker.onmessage = function(e) {
            if (e.data === 'pulse') {
                const startTime = performance.now();
                fetch(`./ping.txt?t=${Date.now()}`, { cache: 'no-store' })
                    .then(res => {
                        if (!res.ok) throw new Error();
                        const latency = Math.round(performance.now() - startTime);
                        latencyText.innerText = `Ping Response Time: ${latency} ms`;
                        statusText.innerText = "Active & Maintaining Connection";
                        statusText.style.color = "#238636";
                        appendLog(`Persistent pulse validated. (${latency}ms)`, "success");
                    })
                    .catch(() => {
                        statusText.innerText = "Connection Error / Retrying...";
                        statusText.style.color = "#f85149";
                        appendLog("Network drop detected by background thread.", "fail");
                    });
            }
        };

        appendLog("Persistent Background System initialized.", "success");
    </script>
</body>
</html>
