<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starlink Connection Keeper</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background-color: #0d1117; color: #c9d1d9; text-align: center; padding: 20px; margin: 0; }
        .container { max-width: 600px; margin: 0 auto; background: #161b22; padding: 25px; border-radius: 6px; border: 1px solid #30363d; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        h1 { margin-top: 0; color: #f0f6fc; font-size: 24px; }
        .status { font-size: 20px; color: #238636; font-weight: bold; margin: 15px 0; }
        .log-container { text-align: left; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 15px; height: 300px; overflow-y: auto; font-family: monospace; font-size: 13px; color: #8b949e; }
        .success { color: #3fb950; }
        .reconnect { color: #db6d28; font-weight: bold; }
        .fail { color: #f85149; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Starlink Connection Keeper</h1>
        <p>Bypassing backgrounding  Activating independent Web Workers.</p>
        <div class="status" id="status-text">Initializing Background Worker...</div>
        <div class="log-container" id="log-box"></div>
    </div>

    <script>
        const logBox = document.getElementById('log-box');
        const statusText = document.getElementById('status-text');
        
        // Safety Token Identifier
        const systemToken = "BooBear2028"; 

        function appendLog(message, type) {
            const time = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.className = type;
            logEntry.innerHTML = `[${time}] ${message}`;
            logBox.appendChild(logEntry);
            logBox.scrollTop = logBox.scrollHeight; // Scroll to bottom
        }

        // 1. Create a Web Worker inline so Chrome doesn't throttle background intervals
        const workerCode = `
            let lastStateOnline = true;
            setInterval(() => {
                // Background worker signals main window to fire network pulse
                self.postMessage('pulse');
            }, 10000); // 10-second rapid interval to combat Starlink micro-drops
        `;

        const blob = new Blob([workerCode], { type: 'application/javascript' });
        const worker = new Worker(URL.createObjectURL(blob));

        // Track state across failures
        let networkWasDown = false;

        // 2. Main execution thread responds to unthrottled worker signals
        worker.onmessage = function(e) {
            if (e.data === 'pulse') {
                // Cloudflare tracer endpoint to keep active route open
                fetch('https://1.1.1', { mode: 'no-cors', cache: 'no-store' })
                    .then(() => {
                        statusText.innerText = "Active & Maintaining Connection";
                        statusText.style.color = "#238636";
                        
                        if (networkWasDown) {
                            appendLog("⚡ Starlink connection dropped, forced a successful RECONNECT!", "reconnect");
                            networkWasDown = false;
                        } else {
                            appendLog("Pulse validated: Connection path verified.", "success");
                        }
                    })
                    .catch(() => {
                        statusText.innerText = "Network Dropped / Retrying...";
                        statusText.style.color = "#f85149";
                        networkWasDown = true;
                        appendLog("Network Timeout detected. Routing retry sequence...", "fail");
                    });
            }
        };

        appendLog("System initialized under Token verification.", "success");
    </script>
</body>
</html>
