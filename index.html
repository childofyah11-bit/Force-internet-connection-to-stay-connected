<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forced Starlink Keeper - and Performance Dashboard</title>
    <link rel="dns-prefetch" href="https://8.8.8">
    <link rel="dns-prefetch" href="https://1.1.1">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background-color: #0d1117; color: #c9d1d9; text-align: center; padding: 20px; margin: 0; }
        .container { max-width: 650px; margin: 0 auto; background: #161b22; padding: 25px; border-radius: 6px; border: 1px solid #30363d; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        h1 { margin-top: 0; color: #f0f6fc; font-size: 24px; }
        .status { font-size: 20px; color: #238636; font-weight: bold; margin: 10px 0; }
        .latency-badge { font-size: 14px; color: #8b949e; background: #21262d; padding: 4px 10px; border-radius: 20px; display: inline-block; margin-bottom: 15px; border: 1px solid #30363d; }
        .perf-panel { background: #0d1117; padding: 15px; border-radius: 6px; margin-bottom: 15px; border: 1px solid #30363d; display: flex; flex-direction: column; gap: 10px; align-items: center; }
        .control-item { font-size: 13px; display: flex; align-items: center; gap: 8px; }
        .btn-action { background-color: #21262d; color: #c9d1d9; border: 1px solid #30363d; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 500; }
        .btn-action:hover { background-color: #30363d; border-color: #8b949e; }
        .log-container { text-align: left; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 15px; height: 260px; overflow-y: auto; font-family: monospace; font-size: 13px; color: #8b949e; }
        .success { color: #3fb950; }
        .reconnect { color: #db6d28; font-weight: bold; }
        .warning { color: #e3b341; }
        .fail { color: #f85149; }
        .perf-text { color: #58a6ff; font-weight: bold; }
        input[type="checkbox"] { accent-color: #238636; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Starlink Connection Keeper <sup>PERF</sup></h1>
        <p style="margin: 5px 0 15px 0; font-size: 14px; color: #8b949e;">Resource-Optimized System Panel</p>
        
        <div class="status" id="status-text">Initializing Background Worker...</div>
        <div class="latency-badge" id="latency-text">Ping Response Time: -- ms</div>

        <div class="perf-panel">
            <div class="control-item">
                <input type="checkbox" id="throttle-idle" checked>
                <label for="throttle-idle">Enable Smart Tab Sleep (Cuts CPU use when hidden)</label>
            </div>
            <button class="btn-action" id="clear-mem-btn">Optimize Tab Memory Usage</button>
        </div>

        <div class="log-container" id="log-box"></div>
    </div>
    <script>
        const logBox = document.getElementById('log-box');
        const statusText = document.getElementById('status-text');
        const latencyText = document.getElementById('latency-text');
        const throttleIdle = document.getElementById('throttle-idle');
        const clearMemBtn = document.getElementById('clear-mem-btn');

        // High-Efficiency Rendering Cache
        let trackingLogs = [];

        function appendLog(message, type) {
            if (document.hidden && throttleIdle.checked) return;

            // Use requestAnimationFrame to let the browser schedule logs when it has free rendering cycles
            requestAnimationFrame(() => {
                const time = new Date().toLocaleTimeString();
                const logEntry = document.createElement('div');
                logEntry.className = type;
                logEntry.innerHTML = `[${time}] ${message}`;
                logBox.appendChild(logEntry);
                logBox.scrollTop = logBox.scrollHeight;
            });
        }

        // Register Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(() => appendLog("Offline system worker validated.", "success"))
                    .catch(err => appendLog(`Worker sync alert: ${err.message}`, "warning"));
            });
        }

        // Memory optimization feature
        clearMemBtn.addEventListener('click', () => {
            // Explicitly clearing local log cache arrays and invoking internal string garbage collections
            trackingLogs = [];
            
            // Re-render empty log container space cleanly
            logBox.innerHTML = '';
            appendLog("Tab memory arrays optimized. Stale logs cleared from RAM.", "perf-text");
        });

        // Background Web Worker execution thread (Zero performance cost to UI thread)
        const workerCode = `
            setInterval(() => {
                self.postMessage('pulse');
            }, 10000);
        `;

        const blob = new Blob([workerCode], { type: 'application/javascript' });
        const worker = new Worker(URL.createObjectURL(blob));
        let networkWasDown = false;

        worker.onmessage = function(e) {
            if (e.data === 'pulse') {
                const startTime = performance.now();

                fetch(`./ping.txt?t=${Date.now()}`, { cache: 'no-store' })
                    .then((res) => {
                        if (!res.ok) throw new Error("Link route dropped");
                        
                        const latency = Math.round(performance.now() - startTime);
                        
                        if (!document.hidden || !throttleIdle.checked) {
                            latencyText.innerText = `Ping Response Time: ${latency} ms`;
                            statusText.innerText = "Active & Maintaining Connection";
                            statusText.style.color = "#238636";
                            
                            appendLog(`Pulse validated: Connection path verified. (${latency}ms)`, "success");
                        }
                    })
                    .catch(() => {
                        if (!document.hidden || !throttleIdle.checked) {
                            statusText.innerText = "Network Dropped / Retrying...";
                            statusText.style.color = "#f85149";
                            latencyText.innerText = "Ping Response Time: Offline";
                        }
                        networkWasDown = true;
                        appendLog("Network Timeout detected. Routing pipeline retry...", "fail");
                    });
            }
        };

        appendLog("System Performance Module active.", "success");
    </script>
</body>
</html>
